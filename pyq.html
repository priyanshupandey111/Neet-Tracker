{% extends "base.html" %}{% block title %}NEET PYQ Test Series{% endblock %}{% block body %}
<div class="hero"><div><small>2016 → 2026 PYQ LIBRARY</small><h1>📚 NEET PYQ Test Series</h1><p>Chapter-wise practice karo, test submit karo aur end mein har question ka solution + desi concept samjho.</p></div><div class="streak">🧠 {{total}} PYQs</div></div>
<section class="card"><form class="filter" method="get"><select name="subject" onchange="this.form.submit()">{% for s in subjects %}<option {% if s==subject %}selected{% endif %}>{{s}}</option>{% endfor %}</select><select name="chapter"><option>All</option>{% for c in chapters %}<option {% if c==chapter %}selected{% endif %}>{{c}}</option>{% endfor %}</select><select name="year"><option>All</option>{% for y in years %}<option {% if y|string==year|string %}selected{% endif %}>{{y}}</option>{% endfor %}</select><select name="phase"><option>All</option>{% for p in phases %}<option {% if p==phase %}selected{% endif %}>{{p}}</option>{% endfor %}<button>Filter</button></form></section>
<section class="card"><div class="title"><div><h2>🎯 Start Test</h2><p class="muted">Current filter: <b>{{subject}}</b> · <b>{{chapter}}</b> · <b>{{year}}</b> · <b>{{phase}}</b></p></div>{% if total %}<a class="primary" href="{{url_for('pyq_test',subject=subject,chapter=chapter,year=year,phase=phase,count=10)}}">Start 10 PYQ Test →</a>{% endif %}</div>
<div class="test-counts"><a href="{{url_for('pyq_test',subject=subject,chapter=chapter,year=year,phase=phase,count=20)}}">20 Questions</a><a href="{{url_for('pyq_test',subject=subject,chapter=chapter,year=year,phase=phase,count=30)}}">30 Questions</a><a href="{{url_for('pyq_test',subject=subject,chapter=chapter,year=year,phase=phase,count=50)}}">50 Questions</a></div></section>
<section class="card"><h2>Available PYQs</h2>{% if rows %}<div class="pyq-table"><div class="pyq-head"><span>Year</span><span>Subject</span><span>Chapter</span><span>Question</span><span>Answer</span></div>{% for q in rows[:120] %}<div class="pyq-row"><span><b>{{q.year}}</b><small>{{q.phase}}</small></span><span>{{q.subject}}</span><span>{{q.chapter}}</span><span>{{q.question[:150] }}{% if q.question|length>150 %}…{% endif %}</span><span class="ans">{{q.answer}}</span></div>{% endfor %}</div>{% if total>120 %}<p class="muted">Showing first 120 here. Test engine can use the complete filtered set.</p>{% endif %}{% else %}<p class="empty">Is filter mein PYQ nahi mila.</p>{% endif %}</section>{% endblock %}
